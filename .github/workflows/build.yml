name: Build and Document deploy

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master
      - uses: pnpm/action-setup@0e279bb9e24b9a33b2ab1a8c69f64e6be8be8cb3 # v6.0.8
      - uses: actions/setup-node@48b55a01f58d42a75c9a6e3a6e6c40cd6be59dbb # v4.4.0
        with:
          node-version-file: "package.json"
          cache: "pnpm"
      - run: pnpm i --frozen-lockfile
      - run: pnpm build
        env:
          CI: true
