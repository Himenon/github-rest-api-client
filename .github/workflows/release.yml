name: Release Workflow

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master
      - uses: pnpm/action-setup@0e279bb9e24b9a33b2ab1a8c69f64e6be8be8cb3 # v6.0.8
      - uses: actions/setup-node@48b55a01f58d42a75c9a6e3a6e6c40cd6be59dbb # v4.4.0
        with:
          node-version-file: "package.json"
          cache: "pnpm"
      - run: pnpm i --frozen-lockfile
      - run: pnpm build

  release-github-registry:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master
      - uses: pnpm/action-setup@0e279bb9e24b9a33b2ab1a8c69f64e6be8be8cb3 # v6.0.8
      - uses: actions/setup-node@48b55a01f58d42a75c9a6e3a6e6c40cd6be59dbb # v4.4.0
        with:
          node-version-file: "package.json"
          registry-url: https://npm.pkg.github.com
          scope: "@Himenon"
          cache: "pnpm"
      - run: pnpm i --frozen-lockfile
      - run: pnpm build
      - run: pnpm run release:github:registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-npm-registry:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master
      - uses: pnpm/action-setup@0e279bb9e24b9a33b2ab1a8c69f64e6be8be8cb3 # v6.0.8
      - uses: actions/setup-node@48b55a01f58d42a75c9a6e3a6e6c40cd6be59dbb # v4.4.0
        with:
          node-version-file: "package.json"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"
      - run: pnpm i --frozen-lockfile
      - run: pnpm build
      - run: NPM_CONFIG_PROVENANCE=true pnpm run release:npm:registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
